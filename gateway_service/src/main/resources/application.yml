server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - Path=/cart/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**
        - id: promotion-service
          uri: http://localhost:8086
          predicates:
            - Path=/promotions/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/notifications/**
